# Publishes a GitHub Release with the Windows installer.
#   - push a version tag:  npm run release -- patch && git push origin main --follow-tags
#   - or run it by hand (Actions → Release → Run workflow, on main): releases package.json's
#     version and creates its tag vX.Y.Z on the commit it built.
# A version with a suffix (0.2.0-beta.1) becomes a pre-release. See docs/RELEASE.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the release and upload the installers

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  FORCE_COLOR: "1"
  npm_config_loglevel: warn

jobs:
  release-windows:
    name: Build and publish the Windows installer
    # Same runner as CI (see ci.yml for why it is pinned).
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python 3.11 for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Release tag (the pushed tag, or v<package.json version> when run by hand)
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then echo "Run it on main (it ran on $GITHUB_REF)"; exit 1; fi
            tag="v$(node -p "require('./package.json').version")"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "$tag already exists: bump the version first (npm run release -- patch)"; exit 1
            fi
          else
            tag="$GITHUB_REF_NAME"
          fi
          node scripts/release.js --check-tag "$tag"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Unit + core tests
        run: npm test

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Build installer (NSIS + portable)
        run: npx electron-builder --win nsis portable --publish never

      - name: Check packaged app
        run: node scripts/check-package.js dist/win-unpacked

      - name: Checksums
        working-directory: dist
        run: sha256sum *.exe > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/release.js --notes "$TAG" > release-notes.md
          prerelease=""
          if [[ "$TAG" == *-* ]]; then prerelease="--prerelease"; fi
          # --target: when run by hand the tag doesn't exist yet; gh creates it on this commit.
          gh release create "$TAG" dist/*.exe dist/SHA256SUMS.txt --target "$GITHUB_SHA" \
            --title "CC-Dashboard ${TAG#v}" \
            --notes-file release-notes.md --generate-notes $prerelease

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs
          path: |
            test-results/
            dist/builder-debug.yml
          if-no-files-found: ignore
